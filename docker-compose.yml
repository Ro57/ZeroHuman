services:
  server:
    build: .
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "${PORT}"
      SERVE_UI: "${SERVE_UI:-true}"
      PAPERCLIP_SECRET: "${PAPERCLIP_SECRET:-}"
      BETTER_AUTH_SECRET: "${PAPERCLIP_SECRET:-}"
      PAPERCLIP_AGENT_JWT_SECRET: "${PAPERCLIP_SECRET:-}"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
      PAPERCLIP_AUTH_BASE_URL_MODE: "explicit"
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: "http://20.228.188.70:3000"
      PAPERCLIP_PUBLIC_URL: "http://20.228.188.70:3000"
      PAPERCLIP_ALLOWED_HOSTNAMES: "20.228.188.70"
      HOST: "0.0.0.0"
    volumes:
      - paperclip-data:/paperclip
    restart: unless-stopped

volumes:
  paperclip-data:
